<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="nd"
    onmouseenter="click()"
    onmouseout="Load()"
    >Hãy di chuột vào đoạn văn này để xem thông báo</p>
    <script>
        function Load(){
            document.getElementById('nd').innerHTML='Bạn vừa di chuột lên thông báo này'
            document.getElementById('nd').style.color='red'
        }
        function click(){
            document.getElementById('nd').innerHTML=''
        }
    </script>
</body>
</html>
